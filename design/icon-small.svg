<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F49AC1"/>
      <stop offset="1" stop-color="#A882FF"/>
    </linearGradient>
  </defs>

  <!-- 小尺寸专用：只留剪影，去掉十字键与按钮。底板加宽、底部缺口加深，
       16px 下仍能看出是手柄而不是一团黑块 -->
  <rect x="5" y="5" width="246" height="246" rx="56" fill="url(#bg)"/>

  <g fill="#20141E">
    <rect x="52" y="70" width="152" height="72" rx="36"/>
    <rect x="42" y="90" width="58" height="96" rx="29"/>
    <rect x="156" y="90" width="58" height="96" rx="29"/>
  </g>
</svg>
